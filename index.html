<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css">
<title>Escapa de Beyoncé</title>
</head>
<body>
<h1>Escapa de Beyoncé</h1>
<p>Muévete con las flechas del teclado. ¡Que no te atrape!</p>
<div id="game-area">
  <div id="player" class="character"></div>
  <div id="beyonce" class="character"></div>
</div>

<section id="config">
  <h2>Configuración</h2>
  <label>Velocidad del jugador: <span id="pv">5</span>
    <input type="range" id="playerSpeed" min="1" max="15" value="5"></label>
  <label>Velocidad del enemigo: <span id="ev">1.5</span>
    <input type="range" id="enemySpeed" min="0.5" max="6" step="0.5" value="1.5"></label>
  <label>Fondo:
    <select id="bg">
      <option value="#f0f0f0">Gris claro</option>
      <option value="#ffe0f0">Rosa</option>
      <option value="#d0f0ff">Azul cielo</option>
      <option value="#222222">Oscuro</option>
    </select></label>
  <label>Volumen: <input type="range" id="volume" min="0" max="1" step="0.1" value="0.3"></label>
  <button id="musicBtn">▶ Música</button>
</section>

<script src="app.js"></script>
</body>
</html>
